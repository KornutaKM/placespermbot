name: Place Source Watch

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app/data/**"
      - "app/place_evidence.py"
      - "app/place_source_probe.py"
      - "app/place_review_queue.py"
      - "app/withheld_places.py"
      - ".github/workflows/place_source_watch.yml"
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  source-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e .
      - name: Check every place against current primary source and map metadata
        run: python -m app.place_source_probe --live --output place-source-scan.json
      - name: Retrieve last successful source scan as comparison baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/place_source_watch.yml/runs?status=success&per_page=10" --jq '.workflow_runs[0].id // ""' 2>/dev/null || true)"
          if [ -n "$previous_run" ]; then
            mkdir -p previous
            if gh run download "$previous_run" --repo "$GITHUB_REPOSITORY" --name place-source-scan --dir previous; then
              echo "Loaded comparison baseline from workflow run $previous_run"
            else
              echo "Historical artifact unavailable; preserving complete current scan without a baseline"
            fi
          else
            echo "No prior successful source scan exists"
          fi
      - name: Build route-aware editorial review queue
        run: |
          if [ -s previous/place-source-scan.json ]; then
            previous_arg=(--previous previous/place-source-scan.json)
          else
            previous_arg=()
          fi
          python -m app.place_review_queue \
            --scan place-source-scan.json \
            --output place-review-queue.json \
            --markdown place-review-queue.md "${previous_arg[@]}"
          cat place-review-queue.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload prioritized review queue with affected routes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: place-review-queue
          path: |
            place-review-queue.json
            place-review-queue.md
          if-no-files-found: warn
          retention-days: 90
      - name: Upload full public source comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: place-source-scan
          path: place-source-scan.json
          if-no-files-found: warn
          retention-days: 90
