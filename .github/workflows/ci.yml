name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Ruff
        run: ruff check .
      - name: Catalog audit
        run: python -m app.catalog_audit
      - name: Release catalog metadata consistency
        run: python -m app.release_consistency --check
      - name: Catalog coverage report
        run: |
          python -m app.catalog_coverage --format json > catalog-coverage.json
          python -m app.catalog_coverage --format markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload catalog coverage
        uses: actions/upload-artifact@v4
        with:
          name: catalog-coverage
          path: catalog-coverage.json
      - name: Route geography review
        run: |
          python -m app.route_review --format json > route-review.json
          python -m app.route_review --format markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Reject impossible editorial route metrics
        run: python -m app.route_review --check --format markdown
      - name: Upload route geography review
        uses: actions/upload-artifact@v4
        with:
          name: route-geography-review
          path: route-review.json
      - name: Parse Windows updater in PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/update-local.ps1').Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors) { throw ($parseErrors | Out-String) }
      - name: Mini App JavaScript syntax
        run: node --check app/miniapp_static/app.js
      - name: Mini App favorites UI regression
        run: node tests/node/test_miniapp_favorites.cjs
      - name: Mini App interactive map regression
        run: node tests/node/test_miniapp_map.cjs
      - name: Mini App My Guide UI regression
        run: node tests/node/test_miniapp_guide.cjs
      - name: Mini App route builder regression
        run: node tests/node/test_miniapp_builder.cjs
      - name: Mini App route stop editor regression
        run: node tests/node/test_miniapp_route_edit.cjs
      - name: Mini App replacement chooser regression
        run: node tests/node/test_miniapp_alternatives.cjs
      - name: Mini App cross-city search regression
        run: node tests/node/test_miniapp_discovery.cjs
      - name: Mini App source provenance regression
        run: node tests/node/test_miniapp_sources.cjs
      - name: Full test suite
        run: pytest -q

  docker-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg "PLACES_BUILD_SHA=$(git rev-parse HEAD)" -t placespermbot:ci .
      - name: Verify image Git revision
        run: |
          EXPECTED="$(git rev-parse HEAD)"
          LABEL="$(docker inspect placespermbot:ci --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          INSIDE="$(docker run --rm placespermbot:ci python -c 'import os; print(os.environ["PLACES_BUILD_SHA"])')"
          test "$EXPECTED" = "$LABEL"
          test "$EXPECTED" = "$INSIDE"
      - name: Run packaged image smoke
        run: >
          docker run --rm
          -e PLACES_BOT_TOKEN=123456789:ci-smoke-token
          -e PLACES_ENVIRONMENT=ci
          -e PLACES_CITY_SLUG=saint-petersburg
          placespermbot:ci
          python -m app.smoke
      - name: Verify packaged Mini App HTTP service
        run: |
          docker run -d --rm --name places-miniapp-ci placespermbot:ci uvicorn app.miniapp_server:app --host 0.0.0.0 --port 8080
          trap 'docker rm -f places-miniapp-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 15); do
            if docker exec places-miniapp-ci python -m app.miniapp_healthcheck; then
              docker exec places-miniapp-ci python -c 'import json, urllib.request; r=json.load(urllib.request.urlopen("http://127.0.0.1:8080/api/cities")); assert len(r["cities"]) >= 45'
              exit 0
            fi
            sleep 2
          done
          docker logs places-miniapp-ci
          exit 1
