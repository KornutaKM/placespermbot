name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Ruff
        run: ruff check .
      - name: Catalog quality gate
        run: pytest -q tests/test_catalog_validation.py tests/test_city_catalogs.py
      - name: Full test suite
        run: pytest -q

  docker-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t placespermbot:ci .
      - name: Run packaged image smoke
        run: >
          docker run --rm
          -e PLACES_BOT_TOKEN=123456789:ci-smoke-token
          -e PLACES_ENVIRONMENT=ci
          -e PLACES_CITY_SLUG=saint-petersburg
          placespermbot:ci
          python -m app.smoke
