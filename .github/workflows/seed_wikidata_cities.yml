name: One-time Wikidata POI fallback

on:
  push:
    branches:
      - feature/mvp-127-osm-guides
    paths:
      - .github/workflows/seed_wikidata_cities.yml

permissions:
  contents: write

jobs:
  wikidata-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mvp-127-osm-guides
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Pilot Wikidata geospatial extraction for 4 Overpass failures
        run: python scripts/wikidata_fallback.py --limit 4
      - name: Commit sourced, reviewable Wikidata evidence to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/wikidata_seed_2026.json docs/wikidata-seed-research.md
          if ! git diff --cached --quiet; then
            git commit -m "MVP-127: record Wikidata pilot geographic evidence"
            git fetch origin feature/mvp-127-osm-guides
            git rebase origin/feature/mvp-127-osm-guides
            git push origin HEAD:feature/mvp-127-osm-guides
          fi
