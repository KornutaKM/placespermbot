[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "places-russia-bot"
version = "0.1.0"
description = "Telegram city guide. Saint Petersburg is the first launch city."
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4",
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["miniapp_static/*.html", "miniapp_static/*.css", "miniapp_static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
