services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - places-data:/app/data

  web:
    build: .
    restart: unless-stopped
    command: uvicorn app.miniapp_server:app --host 0.0.0.0 --port 8080
    healthcheck:
      test: ["CMD", "python", "-m", "app.miniapp_healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - places-data:/app/data

volumes:
  places-data:
